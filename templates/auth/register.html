{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6">

        <div class="card shadow-sm border-0 tn-auth-card">
            <div class="card-body p-4 p-md-5">

                <!-- Heading -->
                <div class="text-center mb-4">
                    <span class="tn-auth-icon">
                        <i class="bi bi-person-plus"></i>
                    </span>
                    <h1 class="h3 fw-bold mt-3 mb-1">Create Account</h1>
                    <p class="text-muted small">Join TrekNest as a Trekker or Staff member</p>
                </div>

                <!-- Registration form -->
                <form method="POST" action="{{ url_for('auth.register') }}">

                    <!-- Role selection (shown prominently at the top) -->
                    <div class="mb-4">
                        <label class="form-label fw-medium">I am registering as a:</label>
                        <div class="d-flex gap-3">
                            <div class="form-check flex-fill tn-role-card p-3 border rounded">
                                <input class="form-check-input" type="radio" name="role"
                                       id="roleUser" value="user" checked>
                                <label class="form-check-label fw-medium w-100" for="roleUser">
                                    <i class="bi bi-person-hiking d-block fs-3 mb-1 text-success"></i>
                                    Trekker
                                    <small class="d-block text-muted fw-normal">Book & explore treks</small>
                                </label>
                            </div>
                            <div class="form-check flex-fill tn-role-card p-3 border rounded">
                                <input class="form-check-input" type="radio" name="role"
                                       id="roleStaff" value="staff">
                                <label class="form-check-label fw-medium w-100" for="roleStaff">
                                    <i class="bi bi-person-badge d-block fs-3 mb-1 text-primary"></i>
                                    Trek Staff
                                    <small class="d-block text-muted fw-normal">Manage treks (needs approval)</small>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="row g-3">
                        <!-- Full Name -->
                        <div class="col-12">
                            <label for="full_name" class="form-label fw-medium">
                                Full Name <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" id="full_name"
                                   name="full_name" placeholder="Your full name" required>
                        </div>

                        <!-- Username -->
                        <div class="col-12 col-md-6">
                            <label for="username" class="form-label fw-medium">
                                Username <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" id="username"
                                   name="username" placeholder="Choose a username" required>
                        </div>

                        <!-- Email -->
                        <div class="col-12 col-md-6">
                            <label for="email" class="form-label fw-medium">
                                Email <span class="text-danger">*</span>
                            </label>
                            <input type="email" class="form-control" id="email"
                                   name="email" placeholder="you@example.com" required>
                        </div>

                        <!-- Password -->
                        <div class="col-12 col-md-6">
                            <label for="password" class="form-label fw-medium">
                                Password <span class="text-danger">*</span>
                            </label>
                            <input type="password" class="form-control" id="password"
                                   name="password" placeholder="Min 6 characters"
                                   minlength="6" required>
                        </div>

                        <!-- Phone -->
                        <div class="col-12 col-md-6">
                            <label for="phone" class="form-label fw-medium">Phone</label>
                            <input type="tel" class="form-control" id="phone"
                                   name="phone" placeholder="(optional)">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2 fw-semibold mt-4" id="registerSubmitBtn">
                        <i class="bi bi-check-circle me-2"></i>Create Account
                    </button>
                </form>

                <!-- Divider -->
                <hr class="my-4">
                <p class="text-center text-muted mb-0 small">
                    Already have an account?
                    <a href="{{ url_for('auth.login') }}" class="text-success fw-medium">Log in</a>
                </p>

            </div>
        </div>

    </div>
</div>
{% endblock %}
